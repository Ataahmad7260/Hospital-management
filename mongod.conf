# MongoDB configuration for local development with Prisma Replica Set
storage:
  dbPath: /home/adnan/mongodb/data

systemLog:
  destination: file
  path: /home/adnan/mongodb/log/mongod.log
  logAppend: true

net:
  port: 27017
  bindIp: 127.0.0.1

replication:
  replSetName: rs0

processManagement:
  fork: true
